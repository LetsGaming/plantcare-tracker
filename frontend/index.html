<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>Plantcare Tracker</title>

    <base href="/" />

    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
    <meta name="description" content="Track watering, fertilizing and care for your houseplants." />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- Standard favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png" />

    <!-- Android Chrome Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/favicons/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicons/android-chrome-512x512.png" />

    <script>
      (function () {
        try {
          var mirror = localStorage.getItem("plantcare.theme");
          var dark =
            mirror === "dark" ||
            (mirror !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("ion-palette-dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          var chrome = document.querySelector('meta[name="theme-color"]');
          if (chrome) chrome.setAttribute("content", dark ? "#14221a" : "#ffffff");
        } catch (e) {}
      })();
    </script>

    <style>
      .boot-skeleton {
        position: fixed;
        inset: 0;
        background: var(--ion-background-color, transparent);
      }
      .boot-skeleton > div {
        height: 56px;
        background: var(--chrome-bg, transparent);
      }
    </style>

    <!-- Manifest File -->
    <link rel="manifest" href="/favicons/manifest.json" />

    <!-- add to homescreen for ios -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PlantCare Tracker" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>

  <body>
    <div id="app">
      <div class="boot-skeleton" aria-hidden="true"><div></div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
