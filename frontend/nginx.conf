# Serves the built app and the uploaded images, and forwards the API to the
# backend container.
#
# TLS and HTTP/2 end in front of this container (reverse proxy or load
# balancer). Terminate TLS there with HTTP/2 enabled (nginx: `listen 443 ssl;
# http2 on;`, Caddy and Traefik do it by default) so the many small image
# requests of a plant grid share one connection. X-Forwarded-Proto from there
# is passed on so cookies get the Secure flag.
#
# Every location that sets add_header repeats the security headers because
# nginx drops inherited add_header directives as soon as a location defines one.

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream backend_api {
    server backend:5000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    sendfile on;
    tcp_nopush on;

    # Image uploads are capped at 10 MB by the API; leave room for the multipart envelope.
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;
    gzip_static on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Shared by every proxied location. The backend owns the security and
    # caching headers of its responses, so nginx's copies are hidden to avoid
    # duplicates.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_read_timeout 60s;
    proxy_send_timeout 120s;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Server-sent events: the sales stream and the plant care guide stream.
    # Buffering stays off so events arrive as they are written. The API prefix
    # carries a version (/api/v2/...), hence the regular expression.
    location ~ ^/api/v[0-9]+/(sales|more-info)/?$ {
        proxy_pass http://backend_api;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Regular API traffic is buffered so slow clients do not hold a Node socket.
    location /api/ {
        proxy_pass http://backend_api;
    }

    # Uploaded images have random file names, so they never change. They are
    # read straight from the data volume, mounted read-only into this container.
    location /uploads/ {
        alias /data/uploads/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
        open_file_cache max=2000 inactive=60s;
        open_file_cache_valid 30s;
        open_file_cache_min_uses 1;
        open_file_cache_errors on;
        try_files $uri =404;
    }

    # Hashed build output.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Workbox runtime chunks are content hashed (workbox-<hash>.js).
    location ~ ^/workbox-[A-Za-z0-9_-]+\.js$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # The service worker and the shell must always be revalidated so updates reach users.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri /index.html;
    }
}
