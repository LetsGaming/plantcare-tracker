# PlantCare CI — typechecks, tests, and the frontend production build
# for every push and pull request.
#
# Both packages use pnpm. The exact pnpm version comes from the
# `packageManager` field in each package.json (read by pnpm/action-setup),
# and the `onlyBuiltDependencies` allowlists in the pnpm-workspace.yaml
# files let pnpm 10 run the native build scripts it would otherwise block
# (better-sqlite3, sharp, esbuild).
#
# Both jobs run independently and in parallel; a failure in one does not
# cancel the other, so a red run always shows the full picture.
#
# Lint and format checks run in both jobs. Pre-existing violations that need
# behavior changes are baselined in each package's eslint-suppressions.json;
# new violations fail the build and the baseline only shrinks
# (`eslint . --prune-suppressions`).

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, typecheck, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Must come before setup-node: the pnpm cache needs pnpm on PATH.
      # The version is read from package.json's `packageManager` field.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      # Tests run against throwaway SQLite databases; these values only need
      # to exist for the config validation, they are not real secrets.
      - name: Tests with coverage gate
        run: pnpm run test:coverage
        env:
          JWT_SECRET: ci-only-test-secret
          JWT_REFRESH_SECRET: ci-only-test-refresh-secret

  frontend:
    name: Frontend (lint, tests, production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # No e2e tests run in CI yet, so skip the ~200 MB Cypress binary.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CYPRESS_INSTALL_BINARY: "0"

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      # Explicit `vitest run`: the package script starts watch mode.
      - name: Tests with coverage gate
        run: pnpm exec vitest run --coverage

      # `pnpm run build` runs vue-tsc first, so this single step covers
      # both the typecheck and the production bundle.
      - name: Typecheck & production build
        run: pnpm run build

  docker:
    name: Docker (build and smoke test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create a throwaway environment
        run: |
          {
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)"
          } > .env

      - name: Build images
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 240

      - name: Smoke test through nginx
        run: |
          set -e
          base=http://localhost:8080
          curl -fsS "$base/healthz"
          curl -fsS "$base/" | grep -q 'id="app"'
          curl -fsS "$base/api/v2/health" | grep -q '"status":"ok"'
          curl -fsS -X POST -H 'content-type: application/json' \
            -d '{"username":"smoke-user","password":"smoke-pass-1"}' \
            "$base/api/v2/auth/register" > /dev/null
          token=$(curl -fsS -X POST -H 'content-type: application/json' \
            -d '{"username":"smoke-user","password":"smoke-pass-1"}' \
            "$base/api/v2/auth/login" | grep -o '"accessToken":"[^"]*"' | cut -d'"' -f4)
          test -n "$token"
          curl -fsS -H "authorization: Bearer $token" "$base/api/v2/plants" > /dev/null

      - name: Chromium starts inside the backend image
        run: docker compose exec -T backend node -e "require('playwright').chromium.launch({ headless: true, args: ['--no-sandbox'] }).then((b) => b.close()).then(() => console.log('chromium ok'))"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  migrate-pm2:
    name: PM2 to Docker migration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Build the backend for the old deployment
        working-directory: backend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Start an old style deployment under PM2
        run: |
          set -e
          npm install -g pm2
          old="$RUNNER_TEMP/old-backend"
          mkdir -p "$old"
          {
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)"
            echo "DB_PATH=./data/plantcare.db"
            echo "NAS_PATH=./uploads"
            echo "PORT=5000"
          } > "$old/.env"
          (cd "$old" && set -a && . ./.env && set +a && NODE_ENV=production pm2 start "$GITHUB_WORKSPACE/backend/dist/server.js" --name plantcare-backend --cwd "$old")
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5000/api/v2/health >/dev/null && break; sleep 1; done
          json='content-type: application/json'
          creds='{"username":"migrated-user","password":"migrate-pass-1"}'
          curl -fsS -X POST -H "$json" -d "$creds" http://127.0.0.1:5000/api/v2/auth/register >/dev/null
          token=$(curl -fsS -X POST -H "$json" -d "$creds" http://127.0.0.1:5000/api/v2/auth/login | grep -o '"accessToken":"[^"]*"' | cut -d'"' -f4)
          sub=$(curl -fsS -X POST -H "$json" -H "authorization: Bearer $token" -d '{"name":"Legacy mix","isPublic":false}' http://127.0.0.1:5000/api/v2/substrates | grep -o '"substrate_id":[0-9]*' | cut -d: -f2)
          curl -fsS -X POST -H "$json" -H "authorization: Bearer $token" -d "{\"name\":\"Legacy Monstera\",\"species\":\"Monstera deliciosa\",\"substrateId\":$sub,\"isPublic\":false}" http://127.0.0.1:5000/api/v2/plants >/dev/null
          mkdir -p "$old/uploads/plant"
          echo legacy > "$old/uploads/plant/legacy.webp"
          pm2 describe plantcare-backend > /dev/null
          # The old frontend app occupies the port the new stack wants, as on a real server.
          echo "require('http').createServer((req, res) => res.end('old frontend')).listen(8080)" > "$RUNNER_TEMP/old-frontend.js"
          pm2 start "$RUNNER_TEMP/old-frontend.js" --name plantcare-frontend
          for i in $(seq 1 15); do curl -fsS http://127.0.0.1:8080 | grep -q 'old frontend' && break; sleep 1; done

      - name: Run the migration script
        run: scripts/migrate-pm2-to-docker.sh --yes --remove-pm2 --backend-dir "$RUNNER_TEMP/old-backend" --http-port 8080 --backup-dir "$RUNNER_TEMP/migration-backup"

      - name: The data survived and PM2 is gone
        run: |
          set -e
          base=http://localhost:8080
          json='content-type: application/json'
          token=$(curl -fsS -X POST -H "$json" -d '{"username":"migrated-user","password":"migrate-pass-1"}' "$base/api/v2/auth/login" | grep -o '"accessToken":"[^"]*"' | cut -d'"' -f4)
          test -n "$token"
          curl -fsS -H "authorization: Bearer $token" "$base/api/v2/plants" | grep -q 'Legacy Monstera'
          curl -fsS "$base/uploads/plant/legacy.webp" | grep -q legacy
          ls "$RUNNER_TEMP/migration-backup/plantcare.db"
          if pm2 describe plantcare-backend > /dev/null 2>&1; then echo "PM2 backend app still registered"; exit 1; fi
          if pm2 describe plantcare-frontend > /dev/null 2>&1; then echo "PM2 frontend app still registered"; exit 1; fi
          curl -fsS "$base/" | grep -q 'id="app"'

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v