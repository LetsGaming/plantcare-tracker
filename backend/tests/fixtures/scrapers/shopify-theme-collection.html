<!doctype html>
<html>
<head>
  <title>Sale</title>
  <link rel="stylesheet" href="https://cdn.shopify.com/s/files/1/theme.css">
</head>
<body>
  <main>
    <div class="grid">
      <product-card class="product-card">
        <figure class="product-card-image">
          <a href="/collections/sale/products/alocasia-nobilis" title="Alocasia 'Nobilis'" class="product-card-image-link">
            <img class="product-primary-image" src="//shop.example/cdn/shop/files/nobilis.jpg?width=375" alt="Alocasia 'Nobilis'">
          </a>
        </figure>
        <div class="product-card-info">
          <a href="/collections/sale/products/alocasia-nobilis" class="product-card-title">Alocasia 'Nobilis'</a>
          <span class="price"><del><span class="amount">29,99€ EUR</span></del> <ins><span class="amount">19,99€ EUR</span></ins></span>
          <small class="unit-price">0,66 €/ml</small>
        </div>
      </product-card>

      <product-card class="product-card">
        <figure class="product-card-image">
          <a href="/collections/sale/products/monstera-albo" title="Monstera Albo" class="product-card-image-link">
            <img class="product-primary-image" src="//shop.example/cdn/shop/files/albo.jpg?width=375" alt="Monstera Albo">
          </a>
        </figure>
        <div class="product-card-info">
          <a href="/collections/sale/products/monstera-albo" class="product-card-title">Monstera Albo</a>
          <span class="price"><del><span class="amount">89,00€ EUR</span></del> <ins><span class="amount">59,00€ EUR</span></ins></span>
          <div class="product-inventory-notice">Ausverkauft</div>
        </div>
      </product-card>

      <product-card class="product-card">
        <figure class="product-card-image">
          <a href="/collections/sale/products/pilea" title="Pilea" class="product-card-image-link">
            <img class="product-primary-image" src="//shop.example/cdn/shop/files/pilea.jpg?width=375" alt="Pilea">
          </a>
        </figure>
        <div class="product-card-info">
          <a href="/collections/sale/products/pilea" class="product-card-title">Pilea</a>
          <span class="price"><span class="amount">12,00€ EUR</span></span>
        </div>
      </product-card>
    </div>
  </main>
</body>
</html>
